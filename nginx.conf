# Reverse proxy that sits in front of the lanime-web SSR app (Node/Express).
#
# Local role (docker-compose): the single public entrypoint on :80. It forwards
# every request to the SSR container. Hashed assets get a long cache header.
#
# AWS mapping (see DEPLOY.md): in production this layer's job is taken over by
# managed services — CloudFront (CDN + cache) in front, and an ALB doing the
# routing/health checks — but the concepts below are exactly the same.

# Name the SSR app upstream once so the routing rules below stay readable.
upstream lanime_web {
    server web:5173; # "web" = the compose service name (Docker DNS)
}

server {
    listen 80;
    server_name _;

    # Sane upload ceiling for an API/SSR app.
    client_max_body_size 20m;

    # --- Static assets -------------------------------------------------------
    # Vite emits content-hashed filenames under /assets/ (e.g. index-a1b2c3.js).
    # The hash changes whenever content changes, so these files are safe to
    # cache forever. In AWS this is exactly what CloudFront/S3 serve.
    location /assets/ {
        proxy_pass http://lanime_web;
        proxy_set_header Host $host;
        # The edge owns the cache policy (like CloudFront would). Drop the
        # app's own Cache-Control so we emit exactly one authoritative header.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Health check --------------------------------------------------------
    # Used by the docker-compose healthcheck today and by an ALB target group
    # later. Kept out of the access log to avoid noise.
    location = /health {
        proxy_pass http://lanime_web;
        access_log off;
    }

    # --- Everything else → SSR ----------------------------------------------
    # Dynamic HTML is rendered per-request by the Node server, so never cache it.
    # The Upgrade/Connection headers also let Vite's dev-server websockets work
    # if you point this proxy at a dev container.
    location / {
        proxy_pass http://lanime_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Local production-like stack for lanime-web (SSR).
#
#   docker compose up --build
#   → open http://localhost      (nginx :80  →  SSR app :5173)
#
# This mirrors the AWS topology described in DEPLOY.md:
#
#   nginx  ≈  CloudFront (CDN/cache) + ALB (routing)
#   web    ≈  ECS / App Runner running the Node SSR container
#
# The web container is NOT published to the host directly — only nginx is.
# That's intentional: in production nothing talks to the app except the proxy.

services:
  # 🌐 lanime-web — Node/Express SSR app (built by the multi-stage Dockerfile).
  web:
    build:
      context: . # repo root = pnpm workspace root (required)
      dockerfile: packages/lanime-web/Dockerfile
      target: runtime
    image: lanime-web:latest
    container_name: lanime-web
    environment:
      NODE_ENV: production
      PORT: "5173"
    expose:
      - "5173" # reachable by other compose services (nginx), not by the host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 🔀 nginx — reverse proxy / edge. The single public entrypoint on :80.
  nginx:
    image: nginx:stable-alpine
    container_name: lanime-nginx
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
